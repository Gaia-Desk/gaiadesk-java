name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [11, 17, 21]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The JDK the tests run on, then JDK 21 (last: JAVA_HOME) to run Gradle and compile with --release 11.
      - uses: actions/setup-java@v4
        id: test-jdk
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build and test
        shell: bash
        run: ./gradlew build --no-daemon -PtestJavaHome="${{ steps.test-jdk.outputs.path }}"
      - name: What would be published
        if: matrix.os == 'ubuntu-latest' && matrix.java == 21
        run: ./gradlew publishMavenPublicationToStagingRepository --no-daemon
